name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  web:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true

  test:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-6vcpu-macos-15, blacksmith-4vcpu-windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: Smoke test
        shell: bash
        run: |
          go build -o reelyard-bin ./cmd/reelyard
          # Torrent port 0 (any free port): under act the job shares the host
          # network, where a running Reelyard may already hold 42069.
          export REELYARD_DATA_DIR="$RUNNER_TEMP/reelyard" REELYARD_LISTEN=127.0.0.1:18787 REELYARD_TORRENT_PORT=0
          ./reelyard-bin serve &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18787/api/v1/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18787/ | grep -q '<div id="root">'
          kill %1

  build:
    needs: [web, test]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: useblacksmith/checkout@v1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          v="${GITHUB_SHA::7}"
          go build -trimpath -ldflags "-s -w -X github.com/reelyard/server/internal/version.Version=$v -X github.com/reelyard/server/internal/version.Commit=$v" \
            -o "reelyard-$GOOS-$GOARCH$ext" ./cmd/reelyard
      - uses: actions/upload-artifact@v4
        with:
          name: reelyard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: reelyard-*

  packages:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=docker
      # Install the .deb on a real systemd host: the service must start and answer.
      - name: Install .deb and check the service
        run: |
          sudo dpkg -i dist/reelyard_*_amd64.deb
          for i in $(seq 30); do curl -sf http://127.0.0.1:8787/api/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8787/api/v1/health
          systemctl is-active reelyard
          sudo dpkg -r reelyard
          ! systemctl is-active reelyard
