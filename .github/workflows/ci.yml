name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true

  test:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - name: Smoke test
        shell: bash
        run: |
          go build -o harbor-bin ./cmd/harbor
          export HARBOR_DATA_DIR="$RUNNER_TEMP/harbor" HARBOR_LISTEN=127.0.0.1:18787
          ./harbor-bin serve &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18787/api/v1/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18787/ | grep -q '<div id="root">'
          kill %1

  build:
    needs: [web, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          v="${GITHUB_SHA::7}"
          go build -trimpath -ldflags "-s -w -X github.com/inluxc/harbor/internal/version.Version=$v -X github.com/inluxc/harbor/internal/version.Commit=$v" \
            -o "harbor-$GOOS-$GOARCH$ext" ./cmd/harbor
      - uses: actions/upload-artifact@v4
        with:
          name: harbor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: harbor-*
